name: Build iOS User App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-ios.yml"
      - "ios/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"

jobs:
  build-user-ios:
    name: Build signed user iOS app
    runs-on: macos-15
    env:
      APP_BUNDLE_ID: com.chickendelight.customer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install dependencies
        run: flutter pub get

      - name: Install Apple signing assets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_CUSTOMER_DISTRIBUTION_P12_BASE64 || secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_CUSTOMER_DISTRIBUTION_P12_PASSWORD || secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_CUSTOMER_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -z "${IOS_DISTRIBUTION_P12_BASE64:-}" ]; then
            echo "::error::Missing signing certificate secret. Add IOS_CUSTOMER_DISTRIBUTION_P12_BASE64 or reuse IOS_DISTRIBUTION_P12_BASE64."
            exit 1
          fi
          if [ -z "${IOS_DISTRIBUTION_P12_PASSWORD:-}" ]; then
            echo "::error::Missing signing certificate password. Add IOS_CUSTOMER_DISTRIBUTION_P12_PASSWORD or reuse IOS_DISTRIBUTION_P12_PASSWORD."
            exit 1
          fi
          if [ -z "${IOS_PROVISION_PROFILE_BASE64:-}" ]; then
            echo "::error::Missing IOS_CUSTOMER_PROVISION_PROFILE_BASE64 for bundle id $APP_BUNDLE_ID."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROVISION_PATH="$RUNNER_TEMP/customer.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"

          printf "%s" "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf "%s" "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROVISION_PATH"

          test -s "$CERTIFICATE_PATH"
          test -s "$PROVISION_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROVISION_PATH" -o "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          cp "$PROVISION_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          cat > "$EXPORT_OPTIONS_PATH" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "EXPORT_OPTIONS_PATH=$EXPORT_OPTIONS_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Configure user app bundle id
        run: |
          set -euo pipefail
          perl -0pi -e 's/PRODUCT_BUNDLE_IDENTIFIER = com\.chickendelight\.rider;/PRODUCT_BUNDLE_IDENTIFIER = $ENV{APP_BUNDLE_ID};/g' ios/Runner.xcodeproj/project.pbxproj
          perl -0pi -e 's/PRODUCT_DISPLAY_NAME = Rider;/PRODUCT_DISPLAY_NAME = "Chicken Delight";/g' ios/Runner.xcodeproj/project.pbxproj
          perl -0pi -e 's/PROVISIONING_PROFILE_SPECIFIER = "Chicken Delight Rider App Store";/PROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE_NAME}";/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Build signed user iOS app
        run: |
          flutter build ipa --release \
            -t lib/main.dart \
            --build-name 1.0.0 \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define RMS_API_BASE_URL=https://rms-backend-v1.vercel.app \
            --export-options-plist "$EXPORT_OPTIONS_PATH"

      - name: Upload signed user IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChickenDelight-User-iOS-signed
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload user build to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/private_keys"
          printf "%s" "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" -print -quit)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
